[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synth-mlx-rl"
version = "0.0.1"
description = "Native reinforcement learning for Apple MLX, with a Tinker-compatible API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Synth Laboratoires" }]
keywords = ["mlx", "reinforcement-learning", "tinker", "apple-silicon"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/synth-laboratoires/synth-mlx-rl"
Repository = "https://github.com/synth-laboratoires/synth-mlx-rl"
Issues = "https://github.com/synth-laboratoires/synth-mlx-rl/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/synth_mlx_rl"]

