[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synth-mlx-rl"
version = "0.6.0"
description = "Native reinforcement learning for Apple MLX, with a Tinker-compatible API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Synth Laboratoires" }]
keywords = ["mlx", "reinforcement-learning", "tinker", "apple-silicon"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.10",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
mlx = [
  "mlx>=0.30; platform_system == 'Darwin' and platform_machine == 'arm64'",
]
dev = [
  "httpx>=0.28",
  "pytest>=8",
  "ruff>=0.9",
]

[project.scripts]
synth-mlx-rl = "synth_mlx_rl.cli:main"

[project.urls]
Homepage = "https://github.com/synth-laboratories/synth-mlx-rl"
Repository = "https://github.com/synth-laboratories/synth-mlx-rl"
Issues = "https://github.com/synth-laboratories/synth-mlx-rl/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/synth_mlx_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "mlx: requires the optional MLX runtime on macOS Apple Silicon",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
